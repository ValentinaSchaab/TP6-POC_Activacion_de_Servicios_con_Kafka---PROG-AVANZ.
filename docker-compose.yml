# POC Activación de Servicios con Kafka
#   Todo:                 docker compose up -d --build
#   Solo infraestructura: docker compose up -d kafka kafka-init kafka-ui mongo mailhog
#   Escenario 5 (loyalty): docker compose --profile loyalty up -d loyalty-service

# Configuración común de los servicios de la POC
x-service: &service
  restart: unless-stopped # si Kafka tarda en arrancar y el servicio falla, Docker lo reintenta
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    mongo:
      condition: service_healthy

services:
  # ---------- Kafka (KRaft, 1 broker) ----------
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092" # acceso desde tu máquina (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 15s

  # ---------- Crea los topics y termina ----------
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  # ---------- Kafka UI ----------
  kafka-ui:
    image: kafbat/kafka-ui:latest # fijar una versión concreta cuando todo funcione
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: poc-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  # ---------- MongoDB (replica set de 1 nodo) ----------
  mongo:
    # 4.4 es la última versión que corre en CPUs sin AVX (mongo 5+ falla con exit 132)
    image: mongo:4.4
    container_name: mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Si el replica set ya responde, sale OK (0). Si no, lo inicializa y sale 1 (reintenta).
      # Usa "mongo" (shell legacy) porque 4.4 no trae mongosh.
      test: >
        mongo --quiet --eval
        "try { var s = rs.status(); if (s.ok == 1) { quit(0) } } catch (e) {} rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(1)"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  # ---------- Mailhog (email simulado) ----------
  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025" # bandeja web
      - "1025:1025" # SMTP

  # ====================== Servicios de la POC ======================
  activation-api:
    <<: *service
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { APP: activation-api }
    ports:
      - "3000:3000"
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: activation-api
      KAFKA_GROUP_ID: activation-api
      MONGO_URI: mongodb://mongo:27017/activation_api?replicaSet=rs0

  billing-service: # sin container_name ni ports: se puede escalar (escenario 4)
    <<: *service
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { APP: billing-service }
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: billing-service
      KAFKA_GROUP_ID: billing-svc
      MONGO_URI: mongodb://mongo:27017/billing?replicaSet=rs0

  provisioning-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { APP: provisioning-service }
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: provisioning-service
      KAFKA_GROUP_ID: provisioning-svc
      MONGO_URI: mongodb://mongo:27017/provisioning?replicaSet=rs0

  notification-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { APP: notification-service }
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-svc
      MONGO_URI: mongodb://mongo:27017/notification?replicaSet=rs0
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"

  crm-analytics-service:
    <<: *service
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { APP: crm-analytics-service }
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: crm-analytics-service
      CRM_GROUP_ID: crm-analytics # para reprocesar todo el historial: usar otro group id
      MONGO_URI: mongodb://mongo:27017/crm_analytics?replicaSet=rs0

  demo-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    ports:
      - "5173:5173"

  # ---------- Escenario 5: consumidor nuevo (no arranca con "up" a secas) ----------
  loyalty-service:
    <<: *service
    profiles: ["loyalty"]
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args: { APP: loyalty-service }
    environment:
      KAFKA_BROKERS: kafka:19092
      KAFKA_CLIENT_ID: loyalty-service
      KAFKA_GROUP_ID: loyalty
      MONGO_URI: mongodb://mongo:27017/loyalty?replicaSet=rs0

volumes:
  mongo-data:
